<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="Dr. Shane Turner · Enterprise AI Executive">
<!-- Source for shane-turner-infographic-vertical.png. Names the site fonts (Fraunces, Inter): render it at 1080 x 1920, inline in a browser page that loads assets/fonts/fraunces-vf.woff2 and inter-vf.woff2 with font-weight: 100 900. -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e2c49"/><stop offset="1" stop-color="#060f1b"/></linearGradient>
  <radialGradient id="glow" cx="0.9" cy="0" r="0.75"><stop offset="0" stop-color="#ddb45e" stop-opacity="0.16"/><stop offset="1" stop-color="#ddb45e" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9fb1c6" stroke-opacity="0.06" stroke-width="1"/></pattern>
</defs>
<rect width="1080" height="1920" fill="url(#bg)"/>
<rect width="1080" height="1920" fill="url(#grid)"/>
<rect width="1080" height="1920" fill="url(#glow)"/>
<rect x="0" y="0" width="1080" height="6" fill="#ddb45e"/>

