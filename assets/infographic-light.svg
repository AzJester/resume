<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Dr. Shane Turner · Enterprise AI Executive">
<!-- Source for shane-turner-infographic-light.png (light variant of infographic.svg). Names the site fonts (Fraunces, Inter): render it at 1920 x 1080, inline in a browser page that loads assets/fonts/fraunces-vf.woff2 and inter-vf.woff2 with font-weight: 100 900. -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf1f5"/></linearGradient>
  <radialGradient id="glow" cx="0.9" cy="0" r="0.65"><stop offset="0" stop-color="#c89a3e" stop-opacity="0.12"/><stop offset="1" stop-color="#c89a3e" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#0e2c49" stroke-opacity="0.05" stroke-width="1"/></pattern>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<rect width="1920" height="1080" fill="url(#grid)"/>
<rect width="1920" height="1080" fill="url(#glow)"/>
<rect x="0" y="0" width="1920" height="6" fill="#c89a3e"/>

<!-- header -->
<text x="110" y="124" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="600" letter-spacing="3" fill="#7e5a12">DR. SHANE TURNER · D.B.A.</text>
<text x="107" y="210" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="78" font-weight="600" letter-spacing="-2" fill="#0e2c49">From AI experiments to</text>
<text x="107" y="294" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="78" font-weight="600" letter-spacing="-2" fill="#9a6f17">measured value.</text>
<rect x="110" y="320" width="120" height="5" rx="2" fill="#c89a3e"/>

