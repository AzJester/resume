<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Dr. Shane Turner · Enterprise AI Executive">
<!-- Source for shane-turner-infographic-square.png. Names the site fonts (Fraunces, Inter): render it at 1080 x 1080, inline in a browser page that loads assets/fonts/fraunces-vf.woff2 and inter-vf.woff2 with font-weight: 100 900. -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e2c49"/><stop offset="1" stop-color="#060f1b"/></linearGradient>
  <radialGradient id="glow" cx="0.9" cy="0" r="0.75"><stop offset="0" stop-color="#ddb45e" stop-opacity="0.16"/><stop offset="1" stop-color="#ddb45e" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9fb1c6" stroke-opacity="0.06" stroke-width="1"/></pattern>
</defs>
<rect width="1080" height="1080" fill="url(#bg)"/>
<rect width="1080" height="1080" fill="url(#grid)"/>
<rect width="1080" height="1080" fill="url(#glow)"/>
<rect x="0" y="0" width="1080" height="6" fill="#ddb45e"/>

<!-- header -->
<text x="90" y="114" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="600" letter-spacing="3" fill="#ddb45e">DR. SHANE TURNER · D.B.A.</text>
<text x="88" y="196" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="62" font-weight="600" letter-spacing="-1.6" fill="#ffffff">From AI experiments to</text>
<text x="88" y="266" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="62" font-weight="600" letter-spacing="-1.6" fill="#ddb45e">measured value.</text>
<rect x="90" y="290" width="110" height="5" rx="2" fill="#ddb45e"/>

